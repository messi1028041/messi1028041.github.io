    .pdf-wrap iframe { width:100%; height:720px; border:0; display:block; }
    @media (max-width:900px) {
      .pdf-wrap iframe { height:520px; }
    }
    .resume-actions { margin-top:14px; display:flex; gap:12px; justify-content:center; }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>

  <header class="site-header">
    <div class="brand">
      <div class="logo" aria-hidden="true">YN</div>
      <div>
        <h1>David Thomas</h1>

      </div>

    <nav class="primary-nav" aria-label="Main navigation">

        <a class="btn primary" href="assets/YourName_Resume.pdf" download="David_Thomas_Resume.pdf">Download PDF</a>

        <!-- fallback / open in new tab -->
        <a class="btn" href="assets/YourName_Resume.pdf" target="_blank" rel="noopener">Open in new tab</a>

    </section>
  </main>
